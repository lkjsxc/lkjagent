[package]
name = "lkjagent-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lkjagent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
crossterm = "0.28.1"
lkjagent-core = { path = "../lkjagent-core" }
lkjagent-effects = { path = "../lkjagent-effects" }
lkjagent-llm = { path = "../lkjagent-llm" }
lkjagent-store = { path = "../lkjagent-store" }
ratatui = "0.28.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde_json = "1"
unicode-segmentation = "1.12.0"
unicode-width = "0.1.14"
